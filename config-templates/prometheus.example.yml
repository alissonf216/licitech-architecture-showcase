# =============================================================================
# prometheus.example.yml
# -----------------------------------------------------------------------------
# SANITIZED scrape configuration — non-functional placeholders.
# Point targets at your internal metrics endpoints only.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: example
    system: licitera-showcase

# Alertmanager — optional placeholder
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

# rule_files:
#   - /etc/prometheus/rules/*.yml
rule_files: []

scrape_configs:
  # ---------------------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # ---------------------------------------------------------------------------
  # API application metrics (EXAMPLE target)
  # ---------------------------------------------------------------------------
  - job_name: licitera-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - api:8000
        labels:
          service: api
          tier: application
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # ---------------------------------------------------------------------------
  # Worker metrics (EXAMPLE — each replica may need service discovery)
  # ---------------------------------------------------------------------------
  - job_name: licitera-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9100
        labels:
          service: worker
          tier: application

  # ---------------------------------------------------------------------------
  # Reverse proxy / node exporters — placeholders
  # ---------------------------------------------------------------------------
  - job_name: nginx-exporter
    static_configs:
      - targets:
          - nginx-exporter:9113
        labels:
          service: proxy

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: host

  # ---------------------------------------------------------------------------
  # Redis exporter placeholder
  # ---------------------------------------------------------------------------
  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis
