# =============================================================================
# nginx.example.conf
# -----------------------------------------------------------------------------
# SANITIZED reverse-proxy example.
# Domains below are fictional: app.example.com / api.example.com
# Terminate TLS in production (certs via ACME or managed load balancer).
# =============================================================================

# Rate limiting zones (example values)
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

upstream licitera_api {
    # Docker DNS name / internal service — EXAMPLE
    server api:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com;

    # In production: redirect to HTTPS or listen 443 ssl http2
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # Tighten CSP to your real frontend origins before production use
    add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'" always;

    # Hide version
    server_tokens off;

    client_max_body_size 5m;
    client_body_timeout  30s;
    client_header_timeout 30s;

    # -------------------------------------------------------------------------
    # Health — optionally restrict by allowlist in production
    # -------------------------------------------------------------------------
    location = /health/live {
        proxy_pass http://licitera_api;
        proxy_http_version 1.1;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://licitera_api;
        proxy_http_version 1.1;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # API
    # -------------------------------------------------------------------------
    location / {
        limit_req  zone=api_per_ip burst=20 nodelay;
        limit_conn addr 20;

        proxy_pass http://licitera_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Do not buffer authenticated API responses aggressively by default
        proxy_buffering on;
    }

    # Deny common probe paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Optional: separate server for marketing/docs static hostnames
server {
    listen 80;
    server_name app.example.com;

    # Prefer hosting the SPA/SSR on Vercel; this block is illustrative only
    return 302 https://app.example.com$request_uri;
}
