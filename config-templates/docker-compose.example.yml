# =============================================================================
# docker-compose.example.yml
# -----------------------------------------------------------------------------
# SANITIZED EXAMPLE — non-functional by design.
# Replace image names, credentials, and hostnames before any real use.
# Never commit real secrets. Prefer a secret manager in production.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  # Application traffic only — not published to the host unless needed
  frontend:
    driver: bridge
  # Internal services (queue, future sidecars)
  backend:
    driver: bridge
    internal: true

volumes:
  redis_data:
    driver: local
  # Placeholder — managed Postgres is preferred in production (e.g. Supabase)
  postgres_data:
    driver: local

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy (optional in compose; often runs on the host / PaaS)
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: licitera-proxy-example
    restart: unless-stopped
    ports:
      - "8080:80"   # EXAMPLE only — use 443 + TLS in real deployments
    volumes:
      - ./nginx.example.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Stateless API
  # ---------------------------------------------------------------------------
  api:
    image: registry.example.com/licitera/api:sha-REPLACE_ME
    container_name: licitera-api-example
    restart: unless-stopped
    env_file:
      - ./env.example
    environment:
      APP_ROLE: api
      DATABASE_URL: "${DATABASE_URL:-postgresql://app:changeme@db:5432/appdb}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    # Example: do not publish API directly in production — go through proxy
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Worker pool — scale with: docker compose up --scale worker=3
  # ---------------------------------------------------------------------------
  worker:
    image: registry.example.com/licitera/api:sha-REPLACE_ME
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]  # EXAMPLE entrypoint
    env_file:
      - ./env.example
    environment:
      APP_ROLE: worker
      DATABASE_URL: "${DATABASE_URL:-postgresql://app:changeme@db:5432/appdb}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-4}"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - backend
      # Egress for public source fetching may require non-internal network:
      - frontend
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Redis — queue / cache placeholder
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: licitera-redis-example
    restart: unless-stopped
    # No host port published — internal only
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Database placeholder — prefer managed PostgreSQL in real environments
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: licitera-db-example
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme   # EXAMPLE — never use in production
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No public ports — connect via internal network only
    logging: *default-logging
